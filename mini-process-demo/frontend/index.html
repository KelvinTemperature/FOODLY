<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Process Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Mini Process Demo</p>
        <h1>Learn the whole workflow with one tiny project.</h1>
        <p class="lead">API first, simple UI second, tests last.</p>
      </section>

      <section class="card">
        <form id="taskForm" class="row">
          <input id="taskTitle" type="text" placeholder="Add a task" />
          <button type="submit">Add</button>
        </form>
        <p id="status" class="status">Ready.</p>
        <ul id="taskList" class="tasks"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
